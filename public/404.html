<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - MediaServe AKWC</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      // Single Page App redirect for GitHub Pages and static hosts
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If deployed on github.io/repo/, keep 1 segment
      if (l.hostname.indexOf('github.io') > -1) {
        pathSegmentsToKeep = 1;
      }
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      // Redirect to root entry point while preserving query parameters
      window.location.replace(
        repoPath + '/?' + (l.search ? l.search.slice(1) : '')
      );
    </script>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 1rem;
        padding: 2.5rem;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f59e0b; }
      p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
      a {
        display: inline-block;
        background-color: #f59e0b;
        color: #020617;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        transition: background-color 0.15s ease;
      }
      a:hover { background-color: #fbbf24; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MediaServe - Page Not Found</h1>
      <p>The requested media roster or service link could not be found, or you may be redirected to the main portal.</p>
      <a href="./">Return to MediaServe Home</a>
    </div>
  </body>
</html>
