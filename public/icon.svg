<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#glow)"/>

  <!-- Media Broadcast Camera Icon & Waves -->
  <g transform="translate(40, 20)">
    <!-- Video Body -->
    <rect x="100" y="150" width="160" height="120" rx="20" fill="url(#amberGold)"/>
    <!-- Lens Angle -->
    <path d="M260 185 L330 145 L330 275 L260 235 Z" fill="url(#amberGold)"/>
    <!-- Lens ring -->
    <circle cx="180" cy="210" r="32" fill="#090d16" stroke="#fbbf24" stroke-width="8"/>
    <circle cx="180" cy="210" r="14" fill="#fbbf24"/>
    
    <!-- Broadcast Waves -->
    <path d="M350 170 A55 55 0 0 1 350 250" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <path d="M375 145 A90 90 0 0 1 375 275" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M400 120 A125 125 0 0 1 400 300" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>

  <!-- Text / Brand Submark -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">MEDIASERVE</text>
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="6">AKWC PRODUCTION</text>
</svg>
